<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft ambient shadows with generous filter regions so nothing clips -->
    <filter id="backSheetShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="loupeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="12" stdDeviation="11" flood-color="#000000" flood-opacity="0.40"/>
    </filter>

    <!-- Paper & Polaroid frame gradients -->
    <linearGradient id="backPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbe4ee"/>
    </linearGradient>
    <linearGradient id="polaroidFrame" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e5ebf2"/>
    </linearGradient>

    <!-- Photo scene gradients (vivid macOS Preview coastal/mountain vibe) -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="72%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.27" cy="0.30" r="0.44">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.98"/>
      <stop offset="28%" stop-color="#fde68a" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#fdba74" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="midMountain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="52%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="nearSlope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="48%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="beachSand" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Magnifying glass metallic & glass gradients -->
    <linearGradient id="bezelOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="78%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bezelRimStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bezelInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glassTint" cx="0.38" cy="0.34" r="0.68">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="56%" stop-color="#e0f2fe" stop-opacity="0.14"/>
      <stop offset="86%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.44"/>
    </radialGradient>
    <linearGradient id="glassGlare" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ferruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="32%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="28%" stop-color="#475569"/>
      <stop offset="52%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Clip paths -->
    <clipPath id="photoClip">
      <rect x="82" y="84" width="292" height="278" rx="10"/>
    </clipPath>
    <clipPath id="lensClip">
      <circle cx="304" cy="296" r="93"/>
    </clipPath>
  </defs>

  <!-- Back stacked document/PDF sheet (subtle tilt right) -->
  <g transform="rotate(7 260 226)" filter="url(#backSheetShadow)">
    <rect x="118" y="52" width="290" height="350" rx="22" fill="url(#backPaper)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Subtle document header & lines peeking out at top-right -->
    <rect x="278" y="86" width="96" height="12" rx="6" fill="#94a3b8" opacity="0.55"/>
    <rect x="278" y="110" width="84" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="278" y="128" width="92" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="278" y="146" width="70" height="8" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Primary Polaroid / Postcard photo (iconic macOS Preview tilt left) -->
  <g transform="rotate(-6 228 244)" filter="url(#cardShadow)">
    <rect x="58" y="60" width="340" height="368" rx="24" fill="url(#polaroidFrame)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Vivid scenic coastal landscape photo -->
    <g clip-path="url(#photoClip)">
      <!-- Sky -->
      <rect x="82" y="84" width="292" height="278" fill="url(#skyGrad)"/>
      <!-- Sun & warm atmospheric glow -->
      <rect x="82" y="84" width="292" height="278" fill="url(#sunGlow)"/>
      <circle cx="158" cy="154" r="24" fill="#fffbeb" opacity="0.96"/>

      <!-- Soft sunlit clouds -->
      <g fill="#ffffff" opacity="0.78">
        <path d="M214 146 C214 137 224 132 234 134 C240 124 256 120 270 126 C282 122 298 128 300 138 C308 140 310 150 298 152 L222 152 C215 152 214 149 214 146 Z"/>
        <ellipse cx="120" cy="192" rx="34" ry="8" opacity="0.52"/>
      </g>

      <!-- Distant atmospheric mountains -->
      <path d="M74 266 L142 188 L198 228 L268 166 L348 226 L382 202 L382 284 L74 284 Z" fill="url(#farMountain)" opacity="0.86"/>

      <!-- Foreground emerald coastal hills -->
      <path d="M74 278 L134 222 L186 250 L236 206 L306 266 L382 234 L382 292 L74 292 Z" fill="url(#midMountain)"/>
      <!-- Sunlit mountain face highlights -->
      <path d="M134 222 L154 270 L74 278 Z" fill="url(#nearSlope)" opacity="0.58"/>
      <path d="M236 206 L264 268 L186 250 Z" fill="url(#nearSlope)" opacity="0.48"/>

      <!-- Turquoise ocean cove -->
      <rect x="82" y="270" width="292" height="96" fill="url(#oceanGrad)"/>
      <!-- Sun reflection shimmer on ocean -->
      <g fill="#fef3c7" opacity="0.58">
        <rect x="136" y="282" width="44" height="4" rx="2"/>
        <rect x="128" y="293" width="58" height="4" rx="2" opacity="0.78"/>
        <rect x="142" y="305" width="34" height="3.5" rx="1.75" opacity="0.58"/>
        <rect x="148" y="316" width="22" height="3" rx="1.5" opacity="0.42"/>
      </g>

      <!-- Sweeping golden shoreline & crisp ocean foam -->
      <path d="M82 334 Q186 314 286 342 T382 332 L382 368 L82 368 Z" fill="url(#beachSand)" opacity="0.92"/>
      <path d="M82 332 Q186 310 286 339 T382 328" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.92"/>
      <path d="M98 322 Q190 303 284 329 T374 319" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.62"/>
    </g>

    <!-- Subtle inner border on photo viewport -->
    <rect x="82" y="84" width="292" height="278" rx="10" fill="none" stroke="#0f172a" stroke-opacity="0.14" stroke-width="2"/>
  </g>

  <!-- Iconic macOS Preview Magnifying Glass Loupe -->
  <g filter="url(#loupeShadow)">
    <!-- Handle (45 deg bottom-right from lens center 304,296) -->
    <g transform="translate(304, 296) rotate(-45)">
      <!-- Metallic collar / ferrule -->
      <rect x="-15" y="100" width="30" height="26" rx="4" fill="url(#ferruleGrad)" stroke="#475569" stroke-width="1.5"/>
      <line x1="-14" y1="109" x2="14" y2="109" stroke="#64748b" stroke-width="1.5" opacity="0.7"/>
      <!-- Anodized graphite tapered handle (sized cleanly inside 512x512 with shadow room) -->
      <path d="M-19 124 L19 124 L23 210 C23 224 12 232 0 232 C-12 232 -23 224 -23 210 Z" fill="url(#handleGrad)" stroke="#0f172a" stroke-width="2"/>
      <!-- Sleek specular highlight down the handle -->
      <rect x="-10" y="134" width="6" height="80" rx="3" fill="#94a3b8" opacity="0.48"/>
      <!-- Silver accent ring near collar -->
      <rect x="-19" y="124" width="38" height="6" rx="2" fill="#e2e8f0" opacity="0.88"/>
    </g>

    <!-- Crystal clear glass lens interior -->
    <g clip-path="url(#lensClip)">
      <!-- Glass refraction gradient -->
      <circle cx="304" cy="296" r="93" fill="url(#glassTint)"/>
      <!-- Glossy curved specular highlight on top-left of lens -->
      <path d="M232 262 C246 218 298 197 350 216 C364 222 370 235 358 241 C316 226 268 240 246 275 C238 287 227 279 232 262 Z" fill="url(#glassGlare)"/>
      <!-- Secondary bottom-right caustic glint -->
      <path d="M338 368 C358 360 374 342 380 322" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.50"/>
    </g>

    <!-- Brushed chrome metallic bezel ring -->
    <circle cx="304" cy="296" r="103" fill="none" stroke="url(#bezelOuter)" stroke-width="22"/>
    <!-- Crisp outer metallic rim -->
    <circle cx="304" cy="296" r="114" fill="none" stroke="url(#bezelRimStroke)" stroke-width="2.5"/>
    <!-- Inner beveled ring -->
    <circle cx="304" cy="296" r="92" fill="none" stroke="url(#bezelInner)" stroke-width="3"/>
  </g>
</svg>
