<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Omarchy Preview</title>
  <desc>A modern dark squircle icon for Hyprland inspired by macOS Preview: layered document and luminous geometric mountain photo card with a sleek frosted-glass magnifying loupe.</desc>
  <defs>
    <!-- Sleek dark Hyprland / Omarchy squircle base -->
    <linearGradient id="appBg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="55%" stop-color="#131620"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="0.32" cy="0.28" r="0.65">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appBorder" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.24"/>
    </linearGradient>

    <!-- Back stacked PDF/document card -->
    <linearGradient id="backCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Photo card frame & luminous geometric mountain scene -->
    <linearGradient id="cardFrame" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="skyScene" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="32%" stop-color="#1d4ed8"/>
      <stop offset="68%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="sunOrb" cx="0.32" cy="0.32" r="0.42">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="38%" stop-color="#7dd3fc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peakBack" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c192c"/>
    </linearGradient>
    <linearGradient id="peakHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Modern minimalist magnifying glass loupe -->
    <linearGradient id="loupeRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="loupeHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="0.35" cy="0.30" r="0.72">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.36"/>
    </radialGradient>
    <linearGradient id="lensSheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <filter id="loupeDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.65"/>
    </filter>

    <clipPath id="sceneClip">
      <rect x="108" y="122" width="234" height="200" rx="16"/>
    </clipPath>
    <clipPath id="lensClip">
      <circle cx="310" cy="302" r="76"/>
    </clipPath>
  </defs>

  <!-- App squircle base (matches Omarchy/Hyprland modern icon geometry) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#appBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambientGlow)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#appBorder)" stroke-width="4"/>

  <!-- Stacked accent sheet behind (signals multi-page PDF / document preview, like Hype's stack) -->
  <g transform="rotate(8 260 220)">
    <rect x="150" y="96" width="244" height="284" rx="28" fill="#090b12" opacity="0.55" transform="translate(0 10)"/>
    <rect x="150" y="96" width="244" height="284" rx="28" fill="url(#backCard)"/>
    <!-- Subtle document indicator bars peeking top-right -->
    <rect x="304" y="126" width="60" height="10" rx="5" fill="#e0e7ff" opacity="0.72"/>
    <rect x="316" y="148" width="48" height="8" rx="4" fill="#c7d2fe" opacity="0.52"/>
  </g>

  <!-- Main tilted Preview photo card -->
  <g transform="rotate(-6 226 244)" filter="url(#softDrop)">
    <rect x="90" y="104" width="270" height="282" rx="28" fill="url(#cardFrame)"/>

    <!-- Geometric luminous landscape inside frame -->
    <g clip-path="url(#sceneClip)">
      <rect x="108" y="122" width="234" height="200" fill="url(#skyScene)"/>
      <rect x="108" y="122" width="234" height="200" fill="url(#sunOrb)"/>
      <!-- Crisp luminous moon/sun orb -->
      <circle cx="176" cy="178" r="22" fill="#fef3c7"/>

      <!-- Geometric Hyprland-style layered alpine peaks -->
      <path d="M98 326 L186 218 L244 268 L296 206 L354 274 L354 326 Z" fill="url(#peakBack)"/>
      <path d="M98 326 L158 248 L218 292 L268 236 L354 326 Z" fill="url(#peakFront)"/>
      <!-- Clean geometric light facet on front peak -->
      <path d="M158 248 L178 326 L98 326 Z" fill="url(#peakHighlight)" opacity="0.38"/>
      <path d="M268 236 L296 326 L218 292 Z" fill="url(#peakHighlight)" opacity="0.32"/>

      <!-- Subtle glass horizon line -->
      <rect x="108" y="294" width="234" height="28" fill="#082f49" opacity="0.45"/>
      <line x1="126" y1="298" x2="224" y2="298" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- Minimalist bottom caption bar hint on the white Polaroid chin -->
    <rect x="120" y="346" width="84" height="10" rx="5" fill="#94a3b8" opacity="0.45"/>
    <rect x="120" y="362" width="52" height="7" rx="3.5" fill="#cbd5e1" opacity="0.7"/>
  </g>

  <!-- Modern Sleek Magnifying Glass Loupe -->
  <g filter="url(#loupeDrop)">
    <!-- Clean geometric pill handle (45 deg bottom-right) -->
    <g transform="translate(310, 302) rotate(-45)">
      <!-- Short dark bridge connector -->
      <rect x="-12" y="84" width="24" height="20" rx="4" fill="#0f172a"/>
      <!-- Glowing cyan-blue sleek capsule handle -->
      <rect x="-17" y="96" width="34" height="90" rx="17" fill="url(#loupeHandle)"/>
      <!-- Crisp top-left highlight edge on handle -->
      <rect x="-9" y="106" width="6" height="68" rx="3" fill="#e0f2fe" opacity="0.58"/>
    </g>

    <!-- Frosted translucent lens -->
    <g clip-path="url(#lensClip)">
      <circle cx="310" cy="302" r="76" fill="url(#lensGlass)"/>
      <!-- Clean geometric diagonal glass sheen -->
      <path d="M248 272 C262 234 306 218 348 234 C358 238 360 250 350 254 C316 242 278 254 260 284 C253 294 244 286 248 272 Z" fill="url(#lensSheen)"/>
    </g>

    <!-- Subtle contrast outer ring so loupe pops crisply against white photo edge -->
    <circle cx="310" cy="302" r="90" fill="none" stroke="#0b0d14" stroke-opacity="0.55" stroke-width="4"/>
    <!-- Bold luminous modern bezel ring -->
    <circle cx="310" cy="302" r="82" fill="none" stroke="url(#loupeRing)" stroke-width="16"/>
  </g>
</svg>
